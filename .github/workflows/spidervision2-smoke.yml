name: SpiderVision2 smoke

on:
  push:
    paths:
      - "SpiderVision2/**"
      - ".github/workflows/spidervision2-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SpiderVision2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall .
      - name: Smoke test
        run: python smoke_test.py
