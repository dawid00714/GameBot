name: Spider smoke check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Spider agent modules
        shell: pwsh
        run: |
          python -m py_compile spider_windows.py spider_state.py spider_solver.py spider_learning.py spider_models.py spider_agent.py spider_app.py
